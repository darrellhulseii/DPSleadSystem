// The API key is entered on the Settings page and kept only in this browser's storage.
const KEY_STORE = "dps_anthropic_api_key";
const getApiKey = () => { try { return localStorage.getItem(KEY_STORE)||""; } catch { return ""; } };

// Opus 5.5 always thinks before answering, and that thinking counts toward max_tokens,
// so the limit leaves room for it plus the reply. Effort controls how much it thinks.
async function claude(sys, msg, { effort="medium", maxTokens=16000 } = {}) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("Add your Anthropic API key on the Settings page first.");
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
      "anthropic-beta":"server-side-fallback-2026-07-01",
    },
    body: JSON.stringify({
      model:"claude-opus-5-5",
      max_tokens:maxTokens,
      output_config:{ effort },
      fallbacks:"default",
      system:[
        { type:"text",text:SHARED_SYSTEM,cache_control:{ type:"ephemeral" } },
        { type:"text",text:sys },
      ],
      messages:[{ role:"user",content:msg }],
    }),
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok || d.error) throw new Error(d.error?.message || `Request failed (${r.status})`);
  if (d.stop_reason==="refusal") throw new Error("Claude declined this request. Try rewording the inputs.");
  const text = (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n\n").trim();
  if (d.stop_reason==="max_tokens") return `${text}\n\n[Output stopped at the length limit. Generate again for a complete version.]`;
  return text;
}

// Shared loading / output / error state for every generator panel.
const useClaude = () => {
  const [out, setOut] = useState("");
  const [loading, setLoading] = useState(false);
  const run = async (sys, msg, opts) => {
    setLoading(true); setOut("");
    try { setOut(await claude(sys, msg, opts)); }
    catch (e) { setOut(`Error: ${e.message}`); }
    finally { setLoading(false); }
  };
  return { out, loading, run };
};

const LeadPipeline = ({ leads, updateLead }) => {
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");

  const exportXLSX = () => {
    const rows = leads.map(l=>({
      "Timestamp":l.timestamp,"First Name":l.firstName,"Last Name":l.lastName,
      "Phone":l.phone,"Email":l.email,"Address":l.address,"City":l.city,"ZIP":l.zip,
      "Lead Source":l.source,"Language":l.language,"Current System":l.currentSystem,
      "Package Interest":l.packageInterest,"New Mover":l.isNewMover?"Yes":"No",
      "Homeowner":l.isHomeowner?"Yes":"No","Has Pets":l.hasPets?"Yes":"No",
      "Urgency":l.urgency,"Best Time":l.bestTime,"Status":l.status,
      "Notes":l.notes,"CCPA":l.ccpa?"Yes":"No",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"DPS Leads");
    XLSX.writeFile(wb,`DPS_Leads_${Date.now()}.xlsx`);
  };

  const allStatuses = Object.keys(STATUS_MAP);
  let shown = leads
    .filter(l=>filter==="All"||l.status===filter)
    .filter(l=>!search||`${l.firstName} ${l.lastName} ${l.phone} ${l.city}`.toLowerCase().includes(search.toLowerCase()));
  shown = [...shown].reverse();

  return (
    <div className="fade-up">
      <div style={{ display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:20 }}>
        <SecHead icon="≡" label="LEAD PIPELINE" sub={`${leads.length} total leads · Export all to Excel`} />
        <Btn onClick={exportXLSX} disabled={!leads.length} variant="dark">⬇ Export Excel ({leads.length})</Btn>
      </div>

      <div style={{ display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, phone, city..." style={{width:220,flex:"0 0 220px"}} />
        {["All",...allStatuses].map(s=>(
          <button key={s} onClick={()=>setFilter(s)} style={{
            padding:"5px 13px",borderRadius:20,fontSize:12,fontWeight:700,
            background:filter===s?STATUS_MAP[s]||BLUE:"transparent",
            color:filter===s?"#fff":MUTED,
            border:`1px solid ${filter===s?STATUS_MAP[s]||BLUE:BDR}`,
          }}>{s}</button>
        ))}
      </div>

      {shown.length===0 ? (
        <Card style={{ textAlign:"center",padding:60 }}>
          <div style={{ fontSize:40,marginBottom:12 }}>🛡️</div>
          <div style={{ color:MUTED }}>No leads yet — capture your first lead to build your DPS pipeline.</div>
        </Card>
      ) : (
        <div style={{ display:"flex",flexDirection:"column",gap:6 }}>
          {shown.map(lead=>(
            <div key={lead.id} style={{ background:CARD,border:`1px solid ${BDR}`,borderRadius:8,padding:"11px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap" }}>
              <div style={{ width:36,height:36,borderRadius:"50%",background:BLUEG,border:`1.5px solid ${BLUE}`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:BLUE,flexShrink:0 }}>
                {lead.firstName?.[0]}{lead.lastName?.[0]}
              </div>
              <div style={{ flex:"1 1 140px",minWidth:0 }}>
                <div style={{ fontWeight:700,fontSize:14,color:WHITE }}>{lead.firstName} {lead.lastName}</div>
                <div style={{ fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:MUTED }}>{lead.phone}</div>
              </div>
              <div style={{ fontSize:12,color:MUTED,flex:"0 0 90px" }}>{lead.city}</div>
              {lead.packageInterest && <Pill color={CYAN}>{lead.packageInterest.split(" ")[0]}</Pill>}
              <div style={{ display:"flex",gap:4,flexWrap:"wrap" }}>
                {lead.isNewMover  && <Pill color={GOLD}>🏡 New Mover</Pill>}
                {lead.isHomeowner && <Pill color={GREEN}>🔑 Owner</Pill>}
                {lead.urgency?.includes("High") && <Pill color={RED}>🔥 Hot</Pill>}
                {lead.language==="Spanish" && <Pill color="#A855F7">🇲🇽 ES</Pill>}
              </div>
              <Pill color={STATUS_MAP[lead.source?.split(" ")[0]]||MUTED}>{lead.source||"Unknown"}</Pill>
              <select value={lead.status} onChange={e=>updateLead(lead.id,{status:e.target.value})}
                style={{ width:140,fontSize:12,fontWeight:700,color:STATUS_MAP[lead.status]||BLUE,background:CARD2,border:`1px solid ${STATUS_MAP[lead.status]||BDR}` }}>
                {allStatuses.map(s=><option key={s}>{s}</option>)}
              </select>
              <div style={{ fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:DIM,flex:"0 0 120px" }}>{lead.timestamp}</div>
            </div>
          ))}

TOPIC: "${topic}"
FOCUS MARKET: ${county}, also covering Gilroy, Morgan Hill, and Salinas

━━━ INTEL BRIEF ━━━

(2–3 sentences)

/* ════════════════════════════════════════════════════════════
   11. SETTINGS
════════════════════════════════════════════════════════════ */
const Settings = () => {
  const [key, setKey] = useState(getApiKey());
  const [msg, setMsg] = useState("");

  const save = () => {
    try {
      if (key.trim()) localStorage.setItem(KEY_STORE, key.trim());
      else localStorage.removeItem(KEY_STORE);
      setMsg(key.trim() ? "Key saved in this browser." : "Key removed from this browser.");
    } catch { setMsg("This browser blocked storage, so the key can't be saved here."); }
  };
  const clear = () => { setKey(""); try { localStorage.removeItem(KEY_STORE); } catch {} setMsg("Key removed from this browser."); };

  return (
    <div className="fade-up">
      <SecHead icon="⚙" label="SETTINGS" sub="Connect the AI tools to your Anthropic account" />
      <Card style={{ maxWidth:620 }}>
        <Fld label="Anthropic API Key">
          <input type="password" value={key} onChange={e=>{ setKey(e.target.value); setMsg(""); }} placeholder="sk-ant-..." autoComplete="off" />
        </Fld>
        <div style={{ display:"flex",gap:8,marginBottom:14 }}>
          <Btn onClick={save}>Save Key</Btn>
          <Btn onClick={clear} variant="ghost">Remove Key</Btn>
        </div>
        {msg && <div style={{ fontSize:12,color:GREEN,marginBottom:12 }}>{msg}</div>}
        <div style={{ fontSize:12,color:MUTED,lineHeight:1.7 }}>
          The Ad Generator, Sales Scripts, SMS, Objection, Social Proof, and Market Intel tools call Claude with this key.
          It is stored only in this browser on this device and is never added to the website's code.
          Anyone with access to this browser can use it, so use a key with a spending limit, and remove it on shared computers.
          Create and limit keys at console.anthropic.com.
        </div>
      </Card>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════
   APP ROOT
════════════════════════════════════════════════════════════ */
// Leads are kept in this browser's storage so they survive a page reload.
const LEADS_STORE = "dps_leads";
const loadLeads = () => { try { return JSON.parse(localStorage.getItem(LEADS_STORE)||"[]"); } catch { return []; } };

function App() {
  const [active, setActive] = useState("command");
  const [leads,  setLeads]  = useState(loadLeads);

  useEffect(() => { try { localStorage.setItem(LEADS_STORE, JSON.stringify(leads)); } catch {} }, [leads]);

  const addLead    = useCallback(l => setLeads(p=>[...p,l]), []);
  const updateLead = useCallback((id,u) => setLeads(p=>p.map(l=>l.id===id?{...l,...u}:l)), []);

  const PAGES = {
    command:    <CommandCenter leads={leads} setActive={setActive} />,
    capture:    <LeadCapture addLead={addLead} />,
    log:        <LeadPipeline leads={leads} updateLead={updateLead} />,
    adgen:      <AdGenerator />,
    scripts:    <SalesScripts />,
    sms:        <SMSEngine />,
    objections: <ObjectionCrusher />,
    packages:   <DPSPackages />,
    reviews:    <SocialProof />,
    intel:      <MarketIntel />,
    settings:   <Settings />,
  };

  return (
    <>
      <style>{CSS}</style>
      <div style={{ display:"flex",minHeight:"100vh" }}>
        <Sidebar active={active} setActive={setActive} leads={leads} />
        <div style={{ marginLeft:230,flex:1,display:"flex",flexDirection:"column" }}>
          <Ticker />
          <main style={{ flex:1,padding:"26px 30px",overflowY:"auto" }}>
            {PAGES[active]}
          </main>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
